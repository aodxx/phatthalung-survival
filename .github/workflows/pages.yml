name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build Pages artifact
        env:
          VITE_BASE_PATH: /phatthalung-survival/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_RUNTIME_BACKEND: supabase
        run: pnpm build

      - name: Add SPA fallback and scope PWA assets
        shell: bash
        run: |
          set -euo pipefail
          cp dist/public/index.html dist/public/404.html
          node <<'NODE'
          const fs = require("node:fs");
          const dir = "dist/public";
          const base = "/phatthalung-survival/";
          const manifestPath = `${dir}/manifest.webmanifest`;
          const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
          manifest.start_url = base;
          manifest.scope = base;
          fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);
          const swPath = `${dir}/sw.js`;
          let sw = fs.readFileSync(swPath, "utf8");
          sw = sw.replace('const APP_SHELL = ["/", "/manifest.webmanifest"];', `const APP_SHELL = ["${base}", "${base}manifest.webmanifest"];`);
          sw = sw.replace('caches.match("/")', `caches.match("${base}")`);
          fs.writeFileSync(swPath, sw);
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
